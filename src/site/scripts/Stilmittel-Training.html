<title>Stilmittel-Training</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: eine schmale Lernspalte auf gepunktetem Papier; handgemachte Karten mit Versatzschatten und Klebestreifen. Farben: Rosehip (Ziegelrot, Koralle, Waldgrün, Salbei auf Rosé). */
:root{
  --paper:#FBEDEA; --dot:#EBCFCA; --surface:#FFF9F7; --ink:#2B1F1E; --muted:#6F5955; --line:#E6C9C3;
  --brick:#B9534F; --coral:#EF7F76; --forest:#3F6B47; --sage:#82BE8E;
  --marker:#F6B4AC; --marker-ink:#2B1F1E; --tape:#82BE8E88;
  --accent:var(--brick); --accent-soft:#F5D6D1;
  --ok:#3F6B47; --ok-soft:#D6EBD9; --bad:#B9534F; --bad-soft:#F9D9D4;
  --shadow:#B9534F; --on-accent:#FFF9F7;
  --hand:"Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --quote:"Literata", Georgia, "Times New Roman", serif;
  --sketch:255px 18px 225px 16px / 16px 225px 18px 255px;
  --sketchbox:18px 30px 14px 34px / 30px 14px 34px 18px;
  --sketch2:18px 225px 16px 255px / 255px 16px 225px 18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#221919; --dot:#3A2B2A; --surface:#2E2322; --ink:#F7E9E6; --muted:#C2A7A2; --line:#4A3734;
  --brick:#E0857F; --coral:#F29B92; --forest:#8CC79A; --sage:#8CC79A;
  --marker:#8A403B; --marker-ink:#FFF4F2; --tape:#5E8F6866;
  --accent:#E0857F; --accent-soft:#4A2E2C;
  --ok:#8CC79A; --ok-soft:#24392A; --bad:#F29B92; --bad-soft:#4A2826;
  --shadow:#7E3A37; --on-accent:#221919; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#221919; --dot:#3A2B2A; --surface:#2E2322; --ink:#F7E9E6; --muted:#C2A7A2; --line:#4A3734;
  --brick:#E0857F; --coral:#F29B92; --forest:#8CC79A; --sage:#8CC79A;
  --marker:#8A403B; --marker-ink:#FFF4F2; --tape:#5E8F6866;
  --accent:#E0857F; --accent-soft:#4A2E2C;
  --ok:#8CC79A; --ok-soft:#24392A; --bad:#F29B92; --bad-soft:#4A2826;
  --shadow:#7E3A37; --on-accent:#221919; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--hand);font-weight:700;text-wrap:balance;margin:0;line-height:1}
h1{font-size:clamp(2.8rem,9vw,4.2rem);transform:rotate(-1.5deg);transform-origin:left}
h2{font-size:2.2rem}
h3{font-size:1.6rem}
p{margin:0}
.hl{position:relative;z-index:0;padding:0 .12em}
.hl::before{content:"";position:absolute;z-index:-1;left:-.05em;right:-.1em;top:.42em;bottom:.02em;background:var(--coral);opacity:.55;border-radius:6px 22px 8px 18px;transform:rotate(-2deg)}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--brick);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}
.btn{border:2px solid var(--ink);background:var(--surface);border-radius:var(--sketch);padding:.5em 1.15em;font-weight:700;box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--brick);color:var(--on-accent)}
.btn.ghost{box-shadow:none;border-color:var(--ink);border-style:dashed;background:transparent}
.btn.ghost:hover{box-shadow:none;transform:none;background:var(--surface)}
.btn.small{padding:.35em .95em;font-size:.95rem}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.note{font-size:.9rem;color:var(--muted)}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:var(--sketch2);padding:.25em .85em;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--sage);border-color:var(--forest);color:#1E2B20;font-weight:700}
/* Karten */
.card{position:relative;background:var(--surface);border:2px solid var(--ink);border-radius:var(--sketchbox);padding:clamp(20px,4vw,32px);display:flex;flex-direction:column;gap:16px;box-shadow:6px 6px 0 var(--shadow)}
.card::before{content:"";position:absolute;top:-12px;left:50%;width:110px;height:26px;margin-left:-55px;background:var(--tape);transform:rotate(-3deg);border-radius:2px}
.card.result::before,.card.flash::before{left:auto;right:28px;transform:rotate(4deg)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.progress{flex:1;min-width:120px;height:12px;border:2px solid var(--ink);border-radius:var(--sketch2);overflow:hidden;background:var(--surface)}
.progress span{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--sage) 0 8px,var(--forest) 8px 11px);transition:width .3s}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem}
.quote{font-family:var(--quote);font-style:italic;font-size:clamp(1.2rem,3.4vw,1.5rem);line-height:1.5}
.src{font-size:.9rem;color:var(--muted)}
mark{background:var(--marker);color:var(--marker-ink);border-radius:4px 10px 3px 8px;padding:0 .12em}
/* Startseite */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.choice{display:flex;flex-direction:column;gap:4px}
.choice span:first-child{font-family:var(--hand);font-size:1.6rem;line-height:1.1}
.choice[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--brick);box-shadow:4px 4px 0 var(--brick)}
.check{display:flex;gap:10px;align-items:center;cursor:pointer}
.check input{width:1.2em;height:1.2em;accent-color:var(--forest)}
.link{border:none;background:none;padding:0;color:var(--brick);text-decoration:underline wavy;text-underline-offset:3px;font-weight:700}
.gamelist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.gamelist li{border-top:2px dashed var(--line);padding:14px 0;display:flex;flex-direction:column;gap:8px}
.gamelist li:last-child{border-bottom:2px dashed var(--line)}
.gl-row{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.gl-name{font-family:var(--hand);font-weight:700;font-size:1.9rem;line-height:1}
.gamelist li:nth-child(odd) .gl-name{transform:rotate(-1deg)}
.gamelist li:nth-child(even) .gl-name{transform:rotate(.8deg)}
.gl-info{display:flex;flex-direction:column;gap:6px;padding:10px 14px;background:var(--paper);border-radius:var(--sketch2)}
.gl-info .sample{font-family:var(--quote);font-style:italic;color:var(--muted)}
/* Antworten */
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.opt{border:2px solid var(--ink);background:var(--surface);border-radius:var(--sketch2);padding:.75em 1em;text-align:left;font-weight:700;box-shadow:3px 3px 0 var(--line);transition:transform .1s,box-shadow .1s}
.opt:nth-child(even){border-radius:var(--sketch)}
.opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--coral)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);box-shadow:3px 3px 0 var(--bad)}
.opt:disabled{cursor:default}
.feedback{border:2px solid var(--ink);border-left-width:6px;padding:12px 16px;background:var(--paper);border-radius:6px 18px 10px 16px;display:flex;flex-direction:column;gap:6px}
.feedback.ok{border-color:var(--ok);background:var(--ok-soft)}
.feedback.bad{border-color:var(--bad);background:var(--bad-soft)}
.feedback strong:first-child{font-family:var(--hand);font-size:1.6rem;line-height:1.1}
/* Karteikarte */
.flash{min-height:260px;cursor:pointer;justify-content:center;text-align:center;align-items:center;transform:rotate(-.6deg);font:inherit;color:inherit}
.flash .big{font-family:var(--hand);font-weight:700;font-size:clamp(2.4rem,7vw,3.4rem);line-height:1}
.flash.back{text-align:left;align-items:stretch;cursor:default;transform:rotate(.4deg)}
/* Memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:560px){.mem{grid-template-columns:repeat(3,1fr)}}
.mc{aspect-ratio:3/4;max-width:100%;border:2px solid var(--ink);border-radius:var(--sketch2);background:var(--brick);color:var(--on-accent);display:flex;align-items:center;justify-content:center;padding:8px;font-size:.82rem;line-height:1.3;text-align:center;overflow:hidden;word-break:break-word;hyphens:auto;box-shadow:3px 3px 0 var(--ink)}
.mc:nth-child(3n){transform:rotate(1.2deg)}.mc:nth-child(4n+1){transform:rotate(-1deg)}
.mc:nth-child(odd){background:var(--forest)}
.mc.open{background:var(--surface);color:var(--ink)}
.mc.name.open{font-family:var(--hand);font-weight:700;font-size:1.35rem;line-height:1}
.mc.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ink);box-shadow:none}
.mc .back{font-family:var(--hand);font-size:2.4rem;opacity:.85}
/* Markieren */
.tokens{font-family:var(--quote);font-style:italic;font-size:clamp(1.2rem,3.4vw,1.5rem);line-height:2.1}
.tok{border:none;background:transparent;font:inherit;padding:0 .12em;border-radius:4px;border-bottom:2px dashed var(--line)}
.tok.sel{background:var(--marker);color:var(--marker-ink);border-bottom-color:transparent;border-radius:4px 10px 3px 8px}
.tok.hit{background:var(--ok-soft);border-bottom:2px solid var(--ok)}
.tok.miss{background:transparent;border-bottom:3px solid var(--ok)}
.tok.wrong{background:transparent;color:var(--muted);border-bottom:2px dotted var(--muted)}
.tok.none{background:var(--bad-soft);border-bottom:2px solid var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;color:var(--muted)}
.imprint{max-width:820px;margin:40px auto 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--hand);font-weight:700;font-size:1.05rem;line-height:1;color:var(--muted);opacity:.85;text-align:center}
.imprint img{width:56px;height:56px;border-radius:50%;transform:rotate(-4deg)}
/* Blitz */
.timer{font-family:var(--hand);font-weight:700;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--brick)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tf .opt{text-align:center;font-size:1.1rem;padding:1em}
.flashok{animation:fo .35s}.flashbad{animation:fb .35s}
@keyframes fo{from{box-shadow:0 0 0 6px var(--ok)}}@keyframes fb{from{box-shadow:0 0 0 6px var(--bad)}}
.result{text-align:center;align-items:center}
.score{font-family:var(--hand);font-size:4.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--brick);transform:rotate(-2deg)}
.review{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.review div{border-top:2px dashed var(--line);padding-top:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

let settings=store.get("settings",{scope:"b",groups:Object.keys(GROUPS)});
function poolIds(){return Object.keys(D).filter(id=>(settings.scope==="e"||D[id][2]==="b")&&settings.groups.includes(D[id][1]))}
function poolEx(){const ids=new Set(poolIds());return EX.filter(e=>ids.has(e.d))}
function distractors(e,n){
  const all=Object.keys(D).filter(id=>id!==e.d&&!e.a.includes(id)&&(settings.scope==="e"||D[id][2]==="b"));
  const near=new Set();PAIRS.forEach(([a,b])=>{if(a===e.d)near.add(b);if(b===e.d)near.add(a)});
  const same=all.filter(id=>D[id][1]===D[e.d][1]);
  const pref=shuffle([...all.filter(id=>near.has(id)),...shuffle(same)]);
  const out=[];for(const id of [...pref,...shuffle(all)]){if(!out.includes(id))out.push(id);if(out.length===n)break}
  return out;
}
function infoBlock(e){
  const g=GROUPS[D[e.d][1]];

  return `<p><strong>${esc(nm(e.d))}:</strong> ${esc(D[e.d][3])}</p>${also}`;
}

  app.innerHTML=`${bar(0,1,"")}<div class="card"><h2>Zu wenig Stilmittel ausgewählt</h2><p>Für dieses Spiel brauchst du mindestens ${min} Stilmittel. Wähle am Anfang mehr Gruppen aus oder nimm die Ergänzung dazu.</p><div class="row"><button class="btn primary" data-home>Zur Startseite</button></div></div>`;bindHome();
}
function resultScreen(title,score,total,mistakes,again){
  const rev=mistakes.length?`<div class="review"><h3>Das solltest du dir noch einmal ansehen</h3>${mistakes.map(m=>`<div>${quote(m,true)}${infoBlock(m)}</div>`).join("")}</div>`:`<p>Alles richtig. Stark!</p>`;
  app.innerHTML=`${bar(1,1,"fertig")}<div class="card result"><p class="eyebrow">${esc(title)}</p><p class="score">${score} / ${total}</p>${rev}<div class="row"><button class="btn primary" id="again">Noch eine Runde</button><button class="btn" data-home>Anderes Spiel</button></div></div>`;
  $("#again").onclick=again;bindHome();window.scrollTo(0,0);
}

];

/* ======================= KARTEIKARTEN ======================= */
function startKarten(dir){
  const ids=poolIds();if(ids.length<2)return tooFew(2);
  if(!dir){
    app.innerHTML=`${bar(0,1,"")}<div class="card"><h2>Karteikarten</h2><p>Wie herum möchtest du lernen?</p>
    <div class="options"><button class="opt" data-dir="name">Begriff → Erklärung<br><span class="note">Du siehst den Namen und erinnerst dich an die Erklärung.</span></button>
    <button class="opt" data-dir="ex">Beispiel → Begriff<br><span class="note">Du siehst ein Beispiel und nennst das Stilmittel.</span></button></div></div>`;
    bindHome();app.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>startKarten(b.dataset.dir));return;
  }
  let deck=shuffle(ids).slice(0,15).map(id=>({id,e:pick(EX.filter(x=>x.d===id))}));
  const total=deck.length;let known=0,flipped=false;const retry=[];
  function show(){
    if(!deck.length){return resultScreen("Karteikarten",total,total,[],()=>startKarten(dir))}
    const c=deck[0];
    const front=dir==="name"?`<p class="eyebrow">Was ist das?</p><p class="big">${esc(nm(c.id))}</p>`:`<p class="eyebrow">Welches Stilmittel steckt hier drin?</p>${quote(c.e,false)}`;
    app.innerHTML=`${bar(known,total,`${known} von ${total} gelernt`)}
    ${flipped?`<div class="card flash back"><p class="eyebrow">${esc(GROUPS[D[c.id][1]].n)}</p><h2>${esc(nm(c.id))}</h2><p>${esc(D[c.id][3])}</p>${quote(c.e,true)}${c.e.a.length?`<p class="note">Auch enthalten: ${c.e.a.map(nm).join(", ")}</p>`:""}</div>
      <div class="row"><button class="btn primary" id="yes">Wusste ich</button><button class="btn" id="no">Noch üben</button></div>`
    :`<button class="card flash" id="flip" aria-label="Karte umdrehen">${front}<p class="note">Antippen zum Umdrehen</p></button>`}`;
    bindHome();
    if(!flipped){$("#flip").onclick=()=>{flipped=true;show()}}
    else{$("#yes").onclick=()=>{deck.shift();known++;flipped=false;show()};
         $("#no").onclick=()=>{const x=deck.shift();x.e=pick(EX.filter(y=>y.d===x.id));deck.splice(Math.min(3,deck.length),0,x);flipped=false;show()}}
  }
  show();
}

/* ======================= QUIZ ======================= */
function startQuiz(){
  const ex=poolEx();if(new Set(ex.map(e=>e.d)).size<4)return tooFew(4);
  // pro Stilmittel höchstens ein Beispiel pro Runde
  const byD={};shuffle(ex).forEach(e=>{if(!byD[e.d])byD[e.d]=e});
  const qs=shuffle(Object.values(byD)).slice(0,10);
  let i=0,score=0;const mistakes=[];
  function show(){
    if(i>=qs.length)return resultScreen("Was ist das?",score,qs.length,mistakes,startQuiz);
    const e=qs[i];const opts=shuffle([e.d,...distractors(e,3)]);
    app.innerHTML=`${bar(i,qs.length,`Frage ${i+1} von ${qs.length}`)}
    <div class="card"><p class="eyebrow">Welches Stilmittel ist hier gemeint?</p><div id="q">${quote(e,false)}</div>
    <div class="options">${opts.map(o=>`<button class="opt" data-o="${o}">${esc(nm(o))}</button>`).join("")}</div><div id="fb"></div></div>`;
    bindHome();
    app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
      const ok=b.dataset.o===e.d;if(ok)score++;else mistakes.push(e);
      app.querySelectorAll("[data-o]").forEach(x=>{x.disabled=true;if(x.dataset.o===e.d)x.classList.add("ok")});if(!ok)b.classList.add("bad");
      $("#q").innerHTML=quote(e,true);
      $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"bad"}"><strong>${ok?"Richtig!":"Leider nicht."}</strong>${infoBlock(e)}</div><div class="row" style="margin-top:12px"><button class="btn primary" id="next">${i+1<qs.length?"Weiter":"Ergebnis"}</button></div>`;
      $("#next").onclick=()=>{i++;show()};$("#next").focus();
    });
  }
  show();
}

/* ======================= MARKIEREN ======================= */
function tokenize(t){
  let txt="",m=[],on=false;for(const ch of t){if(ch==="{"){on=true;continue}if(ch==="}"){on=false;continue}txt+=ch;m.push(on)}
  const out=[];let last=0;const re=/[\p{L}\p{N}’'\-]+/gu;let r;
  while((r=re.exec(txt))){if(r.index>last)out.push({s:txt.slice(last,r.index)});
    let hit=false;for(let k=r.index;k<r.index+r[0].length;k++)if(m[k])hit=true;out.push({w:r[0],hit});last=r.index+r[0].length}
  if(last<txt.length)out.push({s:txt.slice(last)});return out;
}
function startJagd(){
  const ex=poolEx().filter(e=>{if(!e.t.includes("{"))return false;const tk=tokenize(e.t).filter(x=>x.w);const h=tk.filter(x=>x.hit).length;return h>0&&h/tk.length<=.6});
  if(ex.length<3)return tooFew(3);
  const byD={};shuffle(ex).forEach(e=>{if(!byD[e.d])byD[e.d]=e});
  const qs=shuffle(Object.values(byD)).slice(0,8);let i=0,score=0;const mistakes=[];
  function show(){
    if(i>=qs.length)return resultScreen("Markier’s!",score,qs.length,mistakes,startJagd);
    const e=qs[i];const tk=tokenize(e.t);
    app.innerHTML=`${bar(i,qs.length,`Satz ${i+1} von ${qs.length}`)}
    <div class="card"><p class="eyebrow">Stilmittel: ${esc(nm(e.d))}</p><p>Tippe die Wörter an, an denen du das Stilmittel erkennst.</p>
    <p class="tokens">${tk.map((x,k)=>x.w?`<button class="tok" data-k="${k}" aria-pressed="false">${esc(x.w)}</button>`:esc(x.s)).join("")}</p>${e.s?`<p class="src">(${esc(e.s)})</p>`:""}
    <div class="row"><button class="btn primary" id="check">Prüfen</button></div><div id="fb"></div></div>`;
    bindHome();
    app.querySelectorAll(".tok").forEach(b=>b.onclick=()=>{const on=b.classList.toggle("sel");b.setAttribute("aria-pressed",on)});
    $("#check").onclick=()=>{
      let right=0,wrong=0,need=0;
      app.querySelectorAll(".tok").forEach(b=>{const x=tk[b.dataset.k];const sel=b.classList.contains("sel");b.disabled=true;b.classList.remove("sel");
        if(x.hit){need++;if(sel){right++;b.classList.add("hit")}else b.classList.add("miss")}else if(sel){wrong++;b.classList.add("wrong")}});
      const ok=right>0;if(ok)score++;else{mistakes.push(e);app.querySelectorAll(".tok.wrong").forEach(b=>{b.classList.remove("wrong");b.classList.add("none")})}
      const perfect=right===need&&wrong===0;
      const head=perfect?"Genau richtig!":ok?"Richtig erkannt!":"Das war leider nicht die Stelle.";
      const hints=[];
      if(ok&&right<need)hints.push("Grün unterstrichen siehst du, was außerdem noch dazugehört.");
      if(ok&&wrong)hints.push(`Die grau gepunkteten Wörter gehören nicht zu diesem Stilmittel${e.a.length?" – vielleicht hast du dort ein anderes entdeckt (z. B. "+e.a.map(nm).join(", ")+")":""}.`);
      $("#check").remove();
      $("#fb").innerHTML=`<div class="legend"><span><mark style="background:var(--ok-soft)">richtig markiert</mark></span><span style="border-bottom:3px solid var(--ok)">gehört auch dazu</span>${ok?`<span style="border-bottom:2px dotted var(--muted)">nicht Teil dieses Stilmittels</span>`:`<span style="background:var(--bad-soft)">daneben</span>`}</div>
      <div class="feedback ${ok?"ok":"bad"}" style="margin-top:10px"><strong>${head}</strong>${hints.map(h=>`<p>${esc(h)}</p>`).join("")}${infoBlock(e)}</div>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="next">${i+1<qs.length?"Weiter":"Ergebnis"}</button></div>`;
      $("#next").onclick=()=>{i++;show()};$("#next").focus();
    };
  }
  show();
}

/* ======================= MEMORY ======================= */
function startMemory(){
  const ids=poolIds();if(ids.length<4)return tooFew(4);
  const chosen=shuffle(ids).slice(0,6);
  const cards=shuffle(chosen.flatMap(id=>[{id,kind:"name",txt:nm(id)},{id,kind:"def",txt:D[id][3]}]));
  let open=[],done=new Set(),moves=0,lock=false;
  function show(){
    app.innerHTML=`${bar(done.size,chosen.length,`${done.size} von ${chosen.length} Paaren · ${moves} Züge`)}
    <div class="card"><p>Finde zu jedem Begriff die passende Erklärung.</p>
    <div class="mem">${cards.map((c,k)=>{const isOpen=open.includes(k)||done.has(c.id);
      return `<button class="mc ${c.kind} ${isOpen?"open":""} ${done.has(c.id)?"done":""}" data-k="${k}" aria-label="${isOpen?esc(c.txt):"verdeckte Karte"}" ${done.has(c.id)?"disabled":""}>${isOpen?esc(c.txt):`<span class="back">?</span>`}</button>`}).join("")}</div>
    ${done.size===chosen.length?`<div class="feedback ok"><strong>Geschafft in ${moves} Zügen!</strong></div><div class="row"><button class="btn primary" id="again">Neues Memory</button><button class="btn" data-home>Anderes Spiel</button></div>`:""}</div>`;
    bindHome();
    if($("#again"))$("#again").onclick=startMemory;
    app.querySelectorAll(".mc").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k;if(lock||open.includes(k)||done.has(cards[k].id))return;
      open.push(k);
      if(open.length===2){moves++;const [a,c]=open;
        if(cards[a].id===cards[c].id&&cards[a].kind!==cards[c].kind){done.add(cards[a].id);open=[];show()}
        else{lock=true;show();setTimeout(()=>{open=[];lock=false;show()},1300)}}
      else show();
    });
  }
  show();
}

/* ======================= VERWECHSLUNGSGEFAHR ======================= */
function startZwilling(){
  const ids=new Set(poolIds());
  const cand=[];poolEx().forEach(e=>PAIRS.forEach(p=>{const [a,b]=p;const other=e.d===a?b:e.d===b?a:null;if(other&&ids.has(other)&&!e.a.includes(other))cand.push({e,other,diff:p[2]})}));
  if(cand.length<3)return tooFew(4);
  const seenPair=new Set(),seenDev=new Set();const qs=shuffle(cand).filter(c=>{const key=[c.e.d,c.other].sort().join("|");if(seenPair.has(key)||seenDev.has(c.e.d))return false;seenPair.add(key);seenDev.add(c.e.d);return true}).slice(0,10);
  let i=0,score=0;const mistakes=[];
  function show(){
    if(i>=qs.length)return resultScreen("Verwechslungsgefahr",score,qs.length,mistakes,startZwilling);
    const {e,other,diff}=qs[i];const opts=shuffle([e.d,other]);
    app.innerHTML=`${bar(i,qs.length,`Runde ${i+1} von ${qs.length}`)}
    <div class="card"><p class="eyebrow">${esc(nm(opts[0]))} oder ${esc(nm(opts[1]))}?</p><div id="q">${quote(e,false)}</div>
    <div class="tf">${opts.map(o=>`<button class="opt" data-o="${o}">${esc(nm(o))}</button>`).join("")}</div><div id="fb"></div></div>`;
    bindHome();
    app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
      const ok=b.dataset.o===e.d;if(ok)score++;else mistakes.push(e);
      app.querySelectorAll("[data-o]").forEach(x=>{x.disabled=true;if(x.dataset.o===e.d)x.classList.add("ok")});if(!ok)b.classList.add("bad");
      $("#q").innerHTML=quote(e,true);
      $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"bad"}"><strong>${ok?"Richtig!":"Leider nicht."} Es ist: ${esc(nm(e.d))}</strong><p><strong>Der Unterschied:</strong> ${esc(diff)}</p></div><div class="row" style="margin-top:12px"><button class="btn primary" id="next">${i+1<qs.length?"Weiter":"Ergebnis"}</button></div>`;
      $("#next").onclick=()=>{i++;show()};$("#next").focus();
    });
  }
  show();
}

/* ======================= BLITZRUNDE ======================= */
let blitzTimer=null;
function startBlitz(){
  const ex=poolEx();if(new Set(ex.map(e=>e.d)).size<4)return tooFew(4);
  clearInterval(blitzTimer);
  let left=60,score=0,answered=0,cur=null;const mistakes=[];
  let queue=[];const usedEx=new Set();
  function refill(){const byD={};shuffle(ex.filter(x=>!usedEx.has(x.i))).forEach(x=>{if(!byD[x.d])byD[x.d]=x});queue=shuffle(Object.values(byD));if(!queue.length){usedEx.clear();refill()}}
  function next(){
    if(!queue.length)refill();const e=queue.shift();usedEx.add(e.i);const truth=Math.random()<.5;const claim=truth?e.d:pick(distractors(e,4));cur={e,claim,truth};
    app.querySelector("#bq").innerHTML=`${quote(e,false)}<p style="font-size:1.15rem">Das ist: <strong>${esc(nm(claim))}</strong></p>`;
  }
  app.innerHTML=`<div class="bar">${navBtns}<span class="timer" id="t">60</span><span class="count" id="sc">0 Punkte</span></div>
  <div class="card" id="bc"><p class="eyebrow">Stimmt die Zuordnung?</p><div id="bq"></div>
  <div class="tf"><button class="opt" data-a="1">Stimmt</button><button class="opt" data-a="0">Stimmt nicht</button></div>
  <p class="note">Richtig: +1 · Falsch: −1</p></div>`;
  bindHome();
  next();
  app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const ok=(b.dataset.a==="1")===cur.truth;answered++;
    if(ok)score++;else{score=Math.max(0,score-1);if(!mistakes.includes(cur.e))mistakes.push(cur.e)}
    const c=$("#bc");c.classList.remove("flashok","flashbad");void c.offsetWidth;c.classList.add(ok?"flashok":"flashbad");
    $("#sc").textContent=`${score} Punkte`;next();
  });
  blitzTimer=setInterval(()=>{left--;const t=$("#t");if(t)t.textContent=left;if(left<=0){clearInterval(blitzTimer);
    const best=store.get("blitzbest",0);if(score>best)store.set("blitzbest",score);
    resultScreen(score>best&&score>0?"Blitzrunde · neuer Rekord!":"Blitzrunde",score,answered,mistakes.slice(0,6),startBlitz);
    const s=app.querySelector(".score");if(s)s.textContent=`${score} Punkte`;}},1000);
}

start();
</script>
