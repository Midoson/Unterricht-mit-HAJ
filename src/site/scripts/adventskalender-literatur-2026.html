<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interaktiver Adventskalender 2026</title>
<style>
:root{
  --pink:#EF7C8E;
  --rosa:#FDEFF2;
  --grau:#F7F7F7;
  --weiss:#FFFFFF;
  --text:#2B1F24;
  --text-leise:#5A4A50;
  --pink-dunkel:#B4415A;
  --gold:#F4B942;
  --linie:#3B2A30;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--text);
  background:#1A2244 linear-gradient(180deg,#1A2244 0%,#28305F 50%,#463D6E 82%,#6A4E78 100%) fixed;
  overflow-x:hidden;
}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sky .stern{position:absolute;background:#fff;border-radius:50%;opacity:.8;animation:funkeln 3s ease-in-out infinite}
.sky .flocke{position:absolute;top:-12px;background:#fff;border-radius:50%;opacity:.85;animation:fallen linear infinite}
@keyframes funkeln{0%,100%{opacity:.25}50%{opacity:.95}}
@keyframes fallen{to{transform:translate3d(40px,112vh,0)}}

.seite{position:relative;z-index:1}
header{text-align:center;padding:36px 16px 8px}
.kopf-deko{display:flex;justify-content:center;gap:10px;margin-bottom:6px}
.kopf-deko svg{width:26px;height:26px}
h1{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(1.9rem,5.5vw,3.3rem);
  line-height:1.15;
  color:#fff;
  text-shadow:0 3px 0 rgba(239,124,142,.55),0 6px 18px rgba(0,0,0,.35);
}
.klassentitel{margin:10px 0 0;color:var(--rosa);font-size:clamp(1rem,2.6vw,1.2rem);font-weight:600}

.panel{
  max-width:980px;margin:18px auto 22px;padding:14px 18px;
  background:rgba(255,255,255,.96);border-radius:18px;
  display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.panel-wrap{padding:0 16px}
.status{margin:0;font-size:1rem;line-height:1.5}
.vorschau{display:flex;flex-direction:column;gap:4px}
.schalter{display:inline-flex;align-items:center;gap:12px;cursor:pointer;font-weight:700}
.schalter input{position:absolute;opacity:0;width:1px;height:1px}
.spur{position:relative;width:52px;height:30px;border-radius:15px;background:#C9C9D1;border:2px solid var(--linie);transition:background .2s;flex:none}
.spur::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--linie);transition:transform .2s}
.schalter input:checked + .spur{background:var(--pink)}
.schalter input:checked + .spur::after{transform:translateX(22px)}
.schalter input:focus-visible + .spur{outline:4px solid var(--gold);outline-offset:3px}
.vorschau small{color:var(--text-leise);font-size:.85rem}
.vorschau-hinweis{
  flex-basis:100%;margin:0;padding:8px 12px;border-radius:10px;
  background:var(--rosa);border:2px dashed var(--pink);font-size:.95rem
}

.kalender{
  max-width:980px;margin:0 auto;padding:6px 16px 40px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));
  gap:22px 18px;grid-auto-flow:dense;
}
.tuer{
  position:relative;aspect-ratio:1/1;width:100%;
  display:flex;align-items:center;justify-content:center;
  padding:12px;margin:0;cursor:pointer;font:inherit;color:inherit;
  border:2px solid rgba(59,42,48,.18);
  box-shadow:0 6px 0 rgba(0,0,0,.2),0 12px 26px rgba(0,0,0,.28);
  transition:transform .18s ease,box-shadow .18s ease;
}
.tuer svg{width:80%;height:80%;display:block}
.tuer:hover{transform:translateY(-4px) rotate(-1.5deg)}
.tuer:nth-child(even):hover{transform:translateY(-4px) rotate(1.5deg)}
.tuer:focus-visible{outline:4px solid var(--gold);outline-offset:5px}
.tuer.gross{grid-column:span 2;grid-row:span 2}
.tuer.gross svg{width:74%;height:74%}
.s1{border-radius:22px}
.s2{border-radius:50%}
.s3{border-radius:50% 50% 18px 18px / 40% 40% 18px 18px}
.s4{border-radius:28px 8px 28px 8px}
.b1{background:var(--rosa)}
.b2{background:var(--weiss)}
.b3{background:var(--grau)}
.b4{background:linear-gradient(160deg,#fff 0%,var(--rosa) 100%)}
.b5{background:#FFF5E3}
.b6{background:#EAF3FB}
.nummer{
  position:absolute;top:8px;left:8px;min-width:32px;height:32px;padding:0 6px;
  border-radius:16px;background:var(--pink);color:var(--text);border:2px solid #fff;
  font-weight:800;font-size:1.05rem;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 0 rgba(59,42,48,.25);
}
.s2 .nummer{top:4px;left:4px}
.tuer.gross .nummer{min-width:42px;height:42px;border-radius:21px;font-size:1.35rem}
.marke{
  position:absolute;bottom:8px;right:8px;width:28px;height:28px;border-radius:50%;
  background:#fff;border:2px solid var(--linie);display:flex;align-items:center;justify-content:center
}
.s2 .marke{bottom:4px;right:4px}
.marke svg{width:16px;height:16px}
.marke.erledigt{background:#DFF3E6;border-color:#2F7A57;width:32px;height:32px}
.marke.erledigt svg{width:20px;height:20px}
.tuer.heute{box-shadow:0 0 0 4px var(--pink),0 0 28px 8px rgba(239,124,142,.75),0 12px 26px rgba(0,0,0,.28)}
.heute-schild{
  position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);
  background:var(--gold);color:var(--text);font-weight:800;font-size:.8rem;
  padding:2px 10px;border-radius:999px;border:2px solid var(--linie);white-space:nowrap
}

footer{position:relative;z-index:1;margin-top:10px}
footer svg{display:block;width:100%;height:110px}
.fusszeile{background:#fff;text-align:center;padding:4px 16px 24px;margin:0}
.fusszeile .logo{display:block;margin:0 auto;width:160px;height:auto;max-width:45vw}

/* Dialog */
dialog{
  width:min(740px,calc(100vw - 24px));max-height:calc(100vh - 32px);
  padding:0;border:none;border-radius:22px;background:#fff;color:var(--text);
  box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:auto;
}
dialog::backdrop{background:rgba(20,22,48,.72)}
.d-innen{display:flex;flex-direction:column;min-height:100%}
.d-kopf{display:flex;gap:16px;align-items:center;padding:20px 22px;background:var(--rosa);border-bottom:3px solid var(--pink)}
.d-kopf .motiv{flex:none;width:78px;height:78px;border-radius:50%;background:#fff;border:2px solid var(--pink);display:flex;align-items:center;justify-content:center}
.d-kopf .motiv svg{width:62px;height:62px}
.d-datum{margin:0;font-size:.92rem;font-weight:700;color:var(--pink-dunkel)}
.d-titel{margin:2px 0 6px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.35rem,4vw,1.8rem);line-height:1.2}
.chip{display:inline-block;background:#fff;border:2px solid var(--pink);border-radius:999px;padding:2px 12px;font-size:.88rem;font-weight:600}
.d-text{padding:18px 24px 8px;font-size:1.08rem;line-height:1.62}
.d-text p{margin:0 0 14px}
.btn{
  font:inherit;font-weight:700;cursor:pointer;min-height:44px;padding:10px 18px;
  border-radius:12px;border:2px solid var(--linie);background:var(--pink);color:var(--text);
}
.btn:hover{filter:brightness(1.05)}
.btn:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.btn.hell{background:#fff;border-color:var(--pink)}
.block{margin:0 0 16px;padding:14px 16px;border-radius:14px;background:var(--grau)}
.block .frage{font-weight:700;margin:0 0 10px}
.antwort{margin-top:12px;padding:12px 16px;border-left:5px solid var(--pink);background:#fff;border-radius:10px}
.antwort p:last-child{margin-bottom:0}
.optionen{display:flex;flex-wrap:wrap;gap:10px}
.optionen .btn{background:#fff;border-color:var(--pink)}
.optionen .btn.richtig{background:#DFF3E6;border-color:#2F7A57}
.optionen .btn.falsch{background:#FDE3E6;border-color:#B03A4F}
.rueckmeldung{margin-top:12px;padding:12px 16px;border-radius:10px;background:#fff;border-left:5px solid #2F7A57}
.rueckmeldung.daneben{border-left-color:var(--pink)}
.rueckmeldung strong{display:block;margin-bottom:4px}
.rueckmeldung p:last-child{margin-bottom:0}
.fakten{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.fakten li{background:var(--grau);border-radius:12px;padding:10px 14px}
.fakten .etikett{font-weight:800;color:var(--pink-dunkel)}
.gruss{text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:1.45rem;color:var(--pink-dunkel);margin:22px 0 10px!important}
.quelle{margin:6px 0 16px;padding:10px 14px;background:var(--grau);border-radius:12px;font-size:.9rem;line-height:1.5;color:var(--text-leise)}
.quelle strong{color:var(--text)}
.quelle ul{margin:6px 0 0;padding-left:20px}
.quelle li{margin:3px 0}
.quelle a{color:var(--pink-dunkel);font-weight:600;text-underline-offset:2px}
.quelle a:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:3px}
.gesperrt{text-align:center;padding:28px 24px 18px}
.gesperrt .motiv-gross{width:130px;height:130px;margin:0 auto 10px}
.gesperrt .motiv-gross svg{width:100%;height:100%}
.gesperrt h2{font-family:Georgia,"Times New Roman",serif;margin:0 0 8px;font-size:1.6rem}
.gesperrt p{margin:0 0 8px;font-size:1.08rem;line-height:1.55}
.d-fuss{
  position:sticky;bottom:0;margin-top:auto;display:flex;gap:10px;justify-content:space-between;align-items:center;
  padding:12px 18px;background:#fff;border-top:2px solid var(--rosa)
}
.d-fuss .btn{padding:8px 14px}
@media (max-width:520px){
  .kalender{grid-template-columns:repeat(3,1fr);gap:18px 12px}
  .nummer{min-width:26px;height:26px;font-size:.9rem;top:5px;left:5px}
  .marke{width:22px;height:22px;bottom:5px;right:5px}
  .marke svg{width:12px;height:12px}
  .heute-schild{font-size:.7rem;padding:1px 8px}
  .d-kopf{padding:16px}
  .d-kopf .motiv{width:58px;height:58px}
  .d-kopf .motiv svg{width:46px;height:46px}
  .d-text{padding:16px 18px 6px;font-size:1.02rem}
  .d-fuss{padding:10px 12px}
  .d-fuss .btn{padding:8px 10px;font-size:.95rem}
}
@media (prefers-reduced-motion:reduce){
  .sky .flocke,.sky .stern{animation:none}
  .tuer,.tuer:hover,.tuer:nth-child(even):hover{transition:none;transform:none}
}
</style>
</head>

const TUERCHEN = [
{ d:1, motiv:"apfel", name:"Apfel", titel:"Schillers geheime Schublade", format:"Rätselgeschichte",
  inhalt:[
    {t:"p", x:"Stellt euch vor, ihr besucht einen Freund. Er ist nicht zu Hause, ihr setzt euch an seinen Schreibtisch und plötzlich riecht es fürchterlich. Genau das passierte dem Dichter Johann Wolfgang von Goethe in Weimar. Er wartete im Arbeitszimmer seines Freundes Friedrich Schiller, und ihm wurde von dem Geruch so übel, dass er fast ohnmächtig wurde. Er ging der Sache nach und öffnete eine Schreibtischschublade."},
    {t:"wahl", q:"Ratet mal: Was lag darin?", o:["Alte Wollsocken","Faule Äpfel","Ein vergessenes Käsebrot"], r:1,
     a:["Faule Äpfel! Schillers Frau Charlotte erklärte Goethe, die Schublade sei immer damit gefüllt, denn ihr Mann könne ohne den Geruch nicht arbeiten. Schiller schrieb einige der berühmtesten Theaterstücke der deutschen Sprache, zum Beispiel „Die Räuber“ und „Wilhelm Tell“, vielleicht ja wirklich mit Apfelduft in der Nase."]}
  ],
  quelle:[["Planet Wissen (WDR/SWR): Warum roch Schiller an faulen Äpfeln?", "https://www.planet-wissen.de/geschichte/persoenlichkeiten/friedrich_schiller/pwiewissensfrage502.html"], ["Projekt Gutenberg: Eckermann, Gespräche mit Goethe (Originaltext)", "https://projekt-gutenberg.org/authors/johann-peter-eckermann/books/johann-peter-eckermann-gespraeche-mit-goethe/chapter/277"]] },

{ d:2, motiv:"katze", name:"Katze mit Mütze", titel:"Ein Kater schreibt ein Buch", format:"Kuriosität",
  inhalt:[
    {t:"p", x:"Im Jahr 1819 erschien ein Roman mit einem ungewöhnlichen Verfasser: Ein Kater namens Murr erzählt darin sein Leben. Der eigentliche Autor, E. T. A. Hoffmann, behauptet im Vorwort, er sei nur der Herausgeber. Und es wird noch verrückter: Der Kater habe beim Schreiben die gedruckten Seiten eines anderen Buches als Unterlage und Löschpapier benutzt. Die Druckerei habe dann aus Versehen beides zusammen gedruckt. Deshalb springt der Roman ständig mitten im Satz zwischen den eingebildeten Erinnerungen des Katers und der Lebensgeschichte eines verrückten Musikers hin und her."},
    {t:"p", x:"Den Kater gab es übrigens wirklich: Hoffmann hatte einen Kater namens Murr. Als das Tier 1821 starb, schickte Hoffmann an seine Freunde eine richtige Traueranzeige."}
  ],
  quelle:[["Deutsche Digitale Bibliothek: Todesanzeige des Katers Murr (Staatsbibliothek zu Berlin)", "https://www.deutsche-digitale-bibliothek.de/item/G2HO73BEGJNS5FCGCNVYW3NAW4LPFZFL"]] },

{ d:3, motiv:"uhr", name:"Taschenuhr", titel:"Das Geschenk, das schiefging", format:"Kurzgeschichte zum Mitdenken",
  inhalt:[
    {t:"p", x:"Ein junges Paar in New York hat kaum Geld. Della besitzt wunderschöne lange Haare, Jim eine goldene Taschenuhr, sein ganzer Stolz. Kurz vor Weihnachten will jedes von beiden dem anderen etwas Besonderes schenken."},
    {t:"aufloesung", q:"Überlegt kurz: Was könnte schiefgehen?",
     a:["Della verkauft ihre Haare und kauft Jim eine Kette für seine Uhr. Jim verkauft seine Uhr und kauft Della teure Kämme für ihre Haare. Beide Geschenke sind jetzt nutzlos, und trotzdem zeigt die Geschichte, wie sehr die beiden sich lieben."]},
    {t:"p", x:"Die Geschichte heißt „Das Geschenk der Weisen“. Ihr Autor nannte sich O. Henry, hieß aber eigentlich William Sydney Porter. Sein Pseudonym verwendete er unter anderem deshalb, weil er ein paar Jahre im Gefängnis gesessen hatte: Er soll als Bankangestellter Geld veruntreut haben. Im Gefängnis begann er ernsthaft Geschichten zu schreiben."}
  ],
  quelle:[["Encyclopaedia Britannica (englisch): O. Henry", "https://www.britannica.com/biography/O-Henry"], ["History.com (englisch): O. Henry is released from prison", "https://www.history.com/this-day-in-history/july-24/o-henry-is-released-from-prison"]] },

{ d:4, motiv:"buch", name:"Buch", titel:"Kafka lacht sich kaputt", format:"Wahr oder falsch?",
  inhalt:[
    {t:"wahl", q:"Behauptung: Franz Kafka, der heute als Autor besonders düsterer und rätselhafter Geschichten gilt, musste beim Vorlesen seiner eigenen Texte so sehr lachen, dass er nicht weiterlesen konnte.", o:["Wahr","Falsch"], r:0,
     a:["Sein Freund Max Brod berichtet, dass Kafka seinen Freunden den Anfang seines Romans „Der Process“ vorlas. Alle lachten, und Kafka selbst lachte so sehr, dass er zwischendurch aufhören musste."]},
    {t:"p", x:"Noch eine Kuriosität: Kafka hatte Brod gebeten, nach seinem Tod alle unveröffentlichten Manuskripte zu verbrennen. Brod hielt sich nicht daran und veröffentlichte sie stattdessen. Ohne diesen „Wortbruch“ gäbe es einige der berühmtesten Romane des 20. Jahrhunderts heute nicht."}
  ],
  quelle:[["Goethe-Institut: Kafkas Humor – Der große Lacher", "https://www.goethe.de/prj/zei/de/art/25227662.html"], ["Jüdische Allgemeine: 100 Jahre „Der Prozess“", "https://www.juedische-allgemeine.de/kultur/was-kafkas-der-prozess-mit-ki-und-behoerden-wirrwarr-gemeinsam-hat/"]] },

{ d:5, motiv:"handschuh", name:"Fäustling", titel:"Eingesperrt im Wollpulli", format:"Anekdote",
  inhalt:[
    {t:"p", x:"Kennt ihr das? Eine Abgabe steht an, aber draußen ist alles viel spannender. Der französische Schriftsteller Victor Hugo hatte 1830 genau dieses Problem. Er sollte seinem Verlag endlich den Roman „Notre-Dame de Paris“ liefern, den wir als „Der Glöckner von Notre-Dame“ kennen, war aber mit dem Schreiben im Verzug."},
    {t:"p", x:"Seine Lösung: Er kaufte eine Flasche Tinte und ein großes, graues Strickgewand aus Wolle, das ihn von Kopf bis Fuß bedeckte. Seine normale Kleidung ließ er wegschließen, damit er gar nicht erst in Versuchung kam, das Haus zu verlassen. In diesem Aufzug schrieb er Tag für Tag, und der Roman wurde Anfang 1831 tatsächlich fertig. So jedenfalls erzählte es später seine Frau Adèle. Ob alles genau so war, ist nicht sicher, aber die Geschichte ist zu schön, um sie nicht weiterzuerzählen."}
  ],
  quelle:[["Internet Archive (französisch): Adèle Hugo, Victor Hugo raconté par un témoin de sa vie (Originalquelle)", "https://archive.org/details/victorhugoracon01hugo"]] },

{ d:6, motiv:"kerze", name:"Kerze", titel:"Weihnachten auf eigene Rechnung", format:"Schätzfrage",
  inhalt:[
    {t:"p", x:"Charles Dickens schrieb „Eine Weihnachtsgeschichte“ (A Christmas Carol) im Herbst 1843 in nur etwa sechs Wochen. Darin wird der geizige Ebenezer Scrooge, der Weihnachten mit „Humbug!“ abtut, von drei Geistern besucht und wird am Ende ein besserer Mensch."},
    {t:"p", x:"Weil Dickens sich mit seinem Verlag gestritten hatte, bezahlte er den Druck selbst und wollte unbedingt ein schönes Buch: roter Einband, Goldschnitt, farbige Bilder. Das Buch erschien am 19. Dezember 1843."},
    {t:"wahl", q:"Schätzfrage: Wie viele Exemplare wurden bis Heiligabend verkauft, also in nur fünf Tagen?", o:["Rund 600","Rund 6000","Rund 60.000"], r:1,
     a:["Rund 6000! Ein riesiger Erfolg. Trotzdem verdiente Dickens zunächst enttäuschend wenig, weil die schöne Ausstattung so teuer war. Das Wort „Scrooge“ steht im Englischen heute ganz allgemein für einen Geizhals."]}
  ],
  quelle:[["Library of Congress Blog (englisch): A Tale of Two Publishings", "https://blogs.loc.gov/loc/2015/12/highlighting-the-holidays-a-tale-of-two-publishings/"], ["Smithsonian Magazine (englisch): A Christmas Carol", "https://www.smithsonianmag.com/smart-news/a-christmas-carol-marvelously-captured-the-holidays-victorian-spirit-and-inspired-new-traditions-for-centuries-to-come-180985649/"]] },

{ d:7, motiv:"rentier", name:"Rentier", titel:"Donner und Blitz ziehen den Schlitten", format:"Quiz mit drei Fragen",
  inhalt:[
    {t:"aufloesung", q:"Frage 1: Wer hat sich die Namen der Rentiere des Weihnachtsmanns ausgedacht?", knopf:"Antwort zeigen",
     a:["Ein Gedicht! „A Visit from St. Nicholas“, auf Deutsch oft „Die Nacht vor dem Christfest“, erschien am 23. Dezember 1823 ohne Autornamen in einer Zeitung in New York. Darin werden die acht Rentiere zum ersten Mal mit Namen genannt."]},
    {t:"aufloesung", q:"Frage 2: Zwei davon hießen ursprünglich „Dunder“ und „Blixem“. Was bedeutet das?", knopf:"Antwort zeigen",
     a:["Auf Niederländisch ungefähr Donner und Blitz. Später wurden daraus Donner und Blitzen."]},
    {t:"aufloesung", q:"Frage 3: Wo ist Rudolph mit der roten Nase?", knopf:"Antwort zeigen",
     a:["Den gab es 1823 noch gar nicht. Er wurde 1939 von Robert L. May für ein Kaufhaus erfunden, das Malbücher mit seiner Geschichte an Kinder verschenkte."]},
    {t:"p", x:"Bonus: Wer das Gedicht geschrieben hat, ist bis heute umstritten. Clement Clarke Moore beanspruchte es später für sich, die Familie von Henry Livingston behauptet aber, er sei der wahre Autor."}
  ],
  quelle:[["Library of Congress Blog (englisch): A Visit from Santa … Who You Might Not Recognize", "https://blogs.loc.gov/loc/2020/12/a-visit-from-santa-who-you-might-not-recognize/"], ["Smithsonian Institution (englisch): Where did Rudolph get his shiny nose?", "https://si.edu/stories/where-did-rudolph-get-his-shiny-nose"]] },

{ d:8, motiv:"mond", name:"Mond", titel:"Die Krimiautorin, die selbst verschwand", format:"Krimi zum Mitraten",
  inhalt:[
    {t:"p", x:"4. Dezember 1926, England: Am Rand einer Straße in der Nähe von Guildford wird ein verlassenes Auto gefunden. Die Scheinwerfer brennen noch, drinnen liegen ein Pelzmantel und ein Koffer. Die Fahrerin ist verschwunden: Agatha Christie, eine bekannte Krimiautorin."},
    {t:"p", x:"Über tausend Polizisten und Tausende Freiwillige suchen nach ihr. Sogar Arthur Conan Doyle, der Erfinder von Sherlock Holmes, mischt mit: Er gibt einem Hellseher einen ihrer Handschuhe."},
    {t:"aufloesung", q:"Ratet mal: Wo war sie?",
     a:["Nach elf Tagen wurde sie in einem Hotel im Kurort Harrogate gefunden, ganz ruhig und unter falschem Namen angemeldet. Als Nachnamen hatte sie ausgerechnet den der Freundin ihres Ehemanns angegeben.",
        "Was in diesen elf Tagen wirklich in ihr vorging, hat Agatha Christie nie öffentlich erklärt. In ihrer Autobiografie lässt sie die Geschichte einfach weg. Ein Rätsel, das selbst Hercule Poirot nicht gelöst hat."]}
  ],
  quelle:[["National Geographic (englisch): Why did Agatha Christie go missing?", "https://www.nationalgeographic.com/history/article/agatha-christie-mystery-disappearance-theories"], ["The National Archives UK (englisch): The strange disappearance of Mrs Agatha Christie", "https://blog.nationalarchives.gov.uk/20speople-investigating-the-strange-disappearance-of-mrs-agatha-christie/"]] },

{ d:9, motiv:"strumpf", name:"Strumpf", titel:"Gelbe Strümpfe, große Blamage", format:"Szene zum Vorstellen",
  inhalt:[
    {t:"p", x:"In Shakespeares Komödie „Was ihr wollt“ (englisch: Twelfth Night) gibt es den Diener Malvolio. Er ist eingebildet, humorlos und verbietet allen den Spaß. Die anderen spielen ihm deshalb einen Streich: Sie fälschen einen Liebesbrief, der angeblich von seiner Herrin Olivia stammt. Darin steht, er solle gelbe Strümpfe tragen, die Strumpfbänder über Kreuz binden und ununterbrochen lächeln."},
    {t:"p", x:"Malvolio macht genau das und stolziert grinsend in knallgelben Strümpfen vor Olivia herum. Das Problem: Olivia kann Gelb nicht ausstehen, und sie hält ihn sofort für verrückt."},
    {t:"p", x:"Weihnachtsbezug: „Twelfth Night“ ist die zwölfte Nacht nach Weihnachten, also der Abend vor dem 6. Januar. Damit endete früher die Weihnachtszeit mit einem großen Fest, bei dem vieles auf den Kopf gestellt wurde."}
  ],
  quelle:[["Folger Shakespeare Library (englisch): Twelfth Night", "https://www.folger.edu/explore/shakespeares-works/twelfth-night/"], ["Internet Shakespeare Editions, University of Victoria (englisch): Twelfth Night, Akt 2, Szene 5 (Originaltext)", "https://internetshakespeare.uvic.ca/doc/TN_M/scene/2.5/index.html"]] },

{ d:10, motiv:"tanne", name:"Tannenbaum", titel:"O Tannenbaum, du Trauerlied", format:"Wahr oder falsch?",
  inhalt:[
    {t:"wahl", q:"Behauptung: „O Tannenbaum“ war ursprünglich gar kein Weihnachtslied, sondern ein trauriges Liebeslied.", o:["Wahr","Falsch"], r:0,
     a:["1819 schrieb August Zarnack eine Liedfassung, in der die Tanne für Treue steht: Sie bleibt immer grün. Ein Mädchen dagegen ist untreu und lässt den Sänger sitzen. Die Botschaft war also eher: Auf den Baum kann man sich verlassen, auf die Liebste nicht.",
        "Erst 1824 machte der Leipziger Lehrer Ernst Anschütz daraus das Weihnachtslied, das wir heute kennen. Den Anfang übernahm er, die traurige Liebesgeschichte strich er heraus."]}
  ],
  quelle:[["evangelisch.de: Wie „O Tannenbaum“ zum Weihnachtslied wurde", "https://www.evangelisch.de/inhalte/237313/16-12-2024/hits-unterm-christbaum-wie-o-tannenbaum-zum-weihnachtslied-wurde"], ["Sonntagsblatt: Alles über das Weihnachtslied „O Tannenbaum“", "https://www.sonntagsblatt.de/ursprung-liedtext-alles-ueber-das-weihnachtslied-o-tannenbaum"]] },

{ d:11, motiv:"nikolaus", name:"Weihnachtsmann", titel:"Weihnachtsmann, Nationalhymne und ein Kinderlied", format:"Mitsing-Rätsel",
  inhalt:[
    {t:"p", x:"Summt einmal leise die Melodie von „Morgen kommt der Weihnachtsmann“."},
    {t:"aufloesung", q:"Rätsel: Welche anderen Lieder haben genau dieselbe Melodie?",
     a:["Das englische „Twinkle, Twinkle, Little Star“ und das „ABC-Lied“. Die Melodie stammt von einem französischen Lied aus dem 18. Jahrhundert. Sogar Mozart hat Variationen darüber komponiert."]},
    {t:"p", x:"Den deutschen Text schrieb 1835 August Heinrich Hoffmann von Fallersleben. Der Mann ist erstaunlich vielseitig: Er schrieb auch „Alle Vögel sind schon da“ und 1841 auf der Insel Helgoland „Das Lied der Deutschen“. Dessen dritte Strophe ist heute unsere Nationalhymne."},
    {t:"p", x:"Kuriosität: In seiner ursprünglichen Fassung bringt der Weihnachtsmann nicht nur Äpfel und Nüsse, sondern auch „Trommel, Pfeifen und Gewehr“ und ein „ganzes Kriegesheer“. Spielzeuggeschmack hat sich seitdem deutlich verändert."}
  ],
  quelle:[["Stuttgarter Zeitung: Weihnachtslieder und ihre Geschichte", "https://www.stuttgarter-zeitung.de/panorama/weihnachtslieder-texte-pdf-ausdrucken-mitsingen-mhsd-78980688.html"], ["German Way (englisch): „Morgen kommt der Weihnachtsmann“", "https://www.german-way.com/history-and-culture/german-language/german-christmas-carols/morgen-kommt-der-weihnachtsmann"]] },

{ d:12, motiv:"baer", name:"Bär mit Doktorhut", titel:"Lord Byrons Mitbewohner", format:"Anekdote mit Schlusspointe",
  inhalt:[
    {t:"p", x:"Der englische Dichter Lord Byron studierte ab 1805 in Cambridge. Er liebte Tiere, vor allem Hunde. Leider gab es an seinem College eine Regel: Hunde sind verboten."},
    {t:"p", x:"Byron las die Regel genau und stellte fest, dass Bären darin nicht erwähnt wurden. Also besorgte er sich einen zahmen Bären und hielt ihn in Cambridge. In einem Brief an eine Freundin schrieb er 1807 stolz, er habe einen neuen Freund, den besten der Welt: einen zahmen Bären. Als man ihn fragte, was er mit dem Tier vorhabe, soll er geantwortet haben, der Bär solle sich um eine Stelle als Dozent bewerben."}
  ],
  quelle:[["University of Cambridge (englisch): Lord Byron and the bears beneath Cambridge", "https://www.cam.ac.uk/research/news/lord-byron-and-the-bears-beneath-cambridge"], ["Wordsworth Trust (englisch): Lord Byron and his animals", "https://wordsworth.org.uk/blog/2015/04/21/bears-badgers-and-boatswain-lord-byron-and-his-animals/"]] },

{ d:13, motiv:"schneemann", name:"Schneemann", titel:"Der Schneemann und sein ängstlicher Erfinder", format:"Drei Kuriositäten über einen Autor",
  inhalt:[
    {t:"p", x:"Hans Christian Andersen aus Dänemark schrieb weltberühmte Märchen wie „Die kleine Meerjungfrau“ und „Des Kaisers neue Kleider“. 1861 schrieb er auch „Der Schneemann“: Ein Schneemann verliebt sich darin ausgerechnet in einen Ofen."},
    {t:"fakten", f:[
      ["Kuriosität 1","Andersen hatte große Angst, lebendig begraben zu werden. Deshalb legte er nachts oft einen Zettel neben sein Bett, auf dem sinngemäß stand: „Ich bin nur scheintot.“"],
      ["Kuriosität 2","Aus Angst vor Hotelbränden hatte er auf Reisen manchmal ein Seil im Gepäck, um sich im Notfall aus dem Fenster abseilen zu können."],
      ["Kuriosität 3","1857 besuchte er Charles Dickens in England. Geplant waren zwei Wochen, er blieb fünf. Nach der Abreise hängte Dickens im Gästezimmer einen Zettel auf: Hier habe Andersen fünf Wochen geschlafen, die der Familie wie eine Ewigkeit vorkamen."]
    ]}
  ],
  quelle:[["Charles Dickens Museum (englisch): Hans Christian Andersen – The Eccentric Guest", "https://dickensmuseum.com/blogs/charles-dickens-museum/hans-christian-andersen-the-eccentric-guest"], ["Mental Floss (englisch): Facts about Hans Christian Andersen", "https://www.mentalfloss.com/literature/authors/hans-christian-andersen-facts"], ["Open University (englisch): Hans Christian Andersen’s Rope", "https://www.open.ac.uk/blogs/literarytourist/?p=360"]] },

{ d:14, motiv:"schoko", name:"Schokolade", titel:"Hausaufgabe: Schokolade testen", format:"Traumjob-Geschichte",
  inhalt:[
    {t:"p", x:"Stellt euch vor, eure Schule bekommt eine Kiste mit Schokolade, und eure Aufgabe ist es, jede Sorte zu probieren und zu bewerten. Genau das erlebte der junge Roald Dahl in den 1930er-Jahren an seinem Internat in England. Der Schokoladenhersteller Cadbury schickte den Schülern immer wieder Schachteln mit neuen Sorten zum Testen. Die Jungen probierten, vergaben Noten und schrieben Kommentare."},
    {t:"p", x:"Dahl träumte damals davon, eines Tages selbst in einer Erfinderwerkstatt für Süßigkeiten zu arbeiten und eine Schokolade zu erschaffen, die alle begeistert. Jahrzehnte später verarbeitete er diesen Traum literarisch: 1964 erschien „Charlie und die Schokoladenfabrik“ mit dem verrückten Fabrikbesitzer Willy Wonka."}
  ],
  quelle:[["Mental Floss (englisch): 11 Sweet Facts About Cadbury", "https://www.mentalfloss.com/food/candy/11-sweet-facts-about-cadbury"], ["LitCharts (englisch): Roald Dahl, „Boy“, Kapitel „Chocolates“", "https://www.litcharts.com/lit/boy/21-chocolates"]] },

{ d:15, motiv:"eule", name:"Eule", titel:"Tod aus heiterem Himmel", format:"Legende aus der Antike",
  inhalt:[
    {t:"p", x:"Aischylos war einer der ersten großen Theaterdichter im antiken Griechenland. Er lebte vor ungefähr 2500 Jahren und schrieb Tragödien, also ernste Theaterstücke mit meist traurigem Ausgang. Über seinen eigenen Tod wird eine Geschichte erzählt, die eher nach Comic klingt."},
    {t:"p", x:"Nach antiken Berichten saß der ältere, kahlköpfige Dichter auf Sizilien im Freien. Ein Adler flog mit einer Schildkröte in den Krallen über ihn hinweg. Adler lassen Schildkröten auf Steine fallen, um den Panzer zu knacken. Der Adler hielt Aischylos’ glänzende Glatze für einen Felsen, ließ die Schildkröte fallen, und das war das Ende des Dichters."},
    {t:"p", x:"Ob das wirklich so passiert ist, weiß niemand. Die Geschichte wird aber schon in römischen Texten erzählt, also seit fast 2000 Jahren."}
  ],
  quelle:[["Encyclopaedia Britannica (englisch): Aeschylus", "https://www.britannica.com/biography/Aeschylus-Greek-dramatist"]] },

{ d:16, motiv:"wichtel", name:"Wichtel", titel:"Die Königin will mehr Alice", format:"Gerücht oder Wahrheit?",
  inhalt:[
    {t:"p", x:"„Alice im Wunderland“ entstand auf einer Bootsfahrt am 4. Juli 1862. Charles Lutwidge Dodgson, ein Mathematiklehrer aus Oxford, erzählte den drei Schwestern Liddell eine Geschichte. Die zehnjährige Alice bat ihn, sie aufzuschreiben. 1865 erschien das Buch unter dem Namen Lewis Carroll."},
    {t:"p", x:"Bald erzählte man sich folgende Geschichte: Königin Victoria sei von „Alice“ so begeistert gewesen, dass sie das nächste Buch des Autors bestellte. Sie bekam ein trockenes Mathematikbuch über Determinanten."},
    {t:"wahl", q:"Gerücht oder Wahrheit?", o:["Wahrheit","Gerücht"], r:1,
     a:["Es ist ein Gerücht! Dodgson selbst nannte die Geschichte 1896 im Vorwort eines seiner Bücher eine „alberne Geschichte“ und erklärte, dass sie völlig unwahr sei. Mathebücher hat er allerdings wirklich geschrieben. Das Gerücht hält sich trotzdem bis heute."]}
  ],
  quelle:[["Snopes (englisch): Lewis Carroll und Königin Victoria", "https://www.snopes.com/language/literary/carroll.htm"], ["Project Gutenberg (englisch): Lewis Carroll, Symbolic Logic (Originaltext)", "https://www.gutenberg.org/ebooks/28696"]] },

{ d:17, motiv:"lebkuchen", name:"Lebkuchenmann", titel:"Ein Haus aus Brot und Zucker", format:"Vorher-nachher-Vergleich",
  inhalt:[
    {t:"p", x:"Fast alle kennen „Hänsel und Gretel“. Die Brüder Jacob und Wilhelm Grimm veröffentlichten das Märchen 1812 im ersten Band ihrer „Kinder- und Hausmärchen“. Spannend: Die Grimms haben ihre Märchen über die Jahre immer wieder verändert."},
    {t:"p", x:"In der ersten Fassung ist es die leibliche Mutter, die die Kinder im Wald aussetzen will. In späteren Ausgaben wurde daraus eine Stiefmutter, wohl weil eine richtige Mutter, die so etwas tut, für die Leserinnen und Leser zu schrecklich war."},
    {t:"p", x:"Und das berühmte Häuschen? In der Fassung von 1812 ist es kein Lebkuchenhaus. Es ist „aus Brot gebaut“, das Dach ist aus Kuchen, und die Fenster sind „von hellem Zucker“. Das Lebkuchenhaus, wie wir es heute im Advent basteln, ist eine spätere Vorstellung."}
  ],
  quelle:[["Wikisource: Hänsel und Gretel, Fassung von 1812 (Originaltext)", "https://de.wikisource.org/wiki/H%C3%A4nsel_und_Gretel_(1812)"], ["University of Pittsburgh, D. L. Ashliman (englisch): Hänsel und Gretel 1812 und 1857 im Vergleich", "https://sites.pitt.edu/~dash/grimm015a.html"]] },

{ d:18, motiv:"tasse", name:"Tasse", titel:"Kaffee mit dem Löffel", format:"Steckbrief",
  inhalt:[
    {t:"fakten", f:[
      ["Name","Honoré de Balzac"],
      ["Beruf","Schriftsteller in Frankreich, 19. Jahrhundert"],
      ["Werk","rund 90 Romane und Erzählungen, zusammengefasst unter dem Titel „Die menschliche Komödie“"],
      ["Arbeitszeit","oft die ganze Nacht, angeblich gern in einer Art Mönchskutte"],
      ["Geheimwaffe","Kaffee, und zwar sehr viel"]
    ]},
    {t:"p", x:"Balzac schrieb sogar einen Aufsatz über Genussmittel. Darin beschreibt er, wie er den Kaffee am wirksamsten zu sich nahm: Er mahlte die Bohnen besonders fein und aß das Pulver beinahe trocken, mit leerem Magen. Dann, so schreibt er, marschierten die Ideen in seinem Kopf auf wie die Bataillone eines Heeres. Oft heißt es, er habe bis zu 50 Tassen am Tag getrunken. Diese Zahl ist aber wohl eher Legende als gemessen. Bitte nicht nachmachen!"}
  ],
  quelle:[["Open Culture (englisch): Balzac’s Extreme Coffee Habit", "https://www.openculture.com/2026/10/how-balzacs-extreme-coffee-habit-fueled-his-productive-writing-routine.html"], ["Wikisource (französisch): Balzac, Traité des excitants modernes (Originaltext)", "https://fr.wikisource.org/wiki/Trait%C3%A9_des_excitants_modernes"]] },

{ d:19, motiv:"glocke", name:"Glocke", titel:"Ein Weihnachtsbaum und das Werther-Fieber", format:"Zwei Kuriositäten zu einem Buch",
  inhalt:[
    {t:"p", x:"1774 veröffentlichte der junge Goethe den Roman „Die Leiden des jungen Werthers“. Werther verliebt sich darin unglücklich in Lotte, die schon verlobt ist."},
    {t:"fakten", f:[
      ["Kuriosität 1","Im Roman taucht einer der frühesten Weihnachtsbäume der deutschen Literatur auf. Lotte erzählt von Weihnachten, wenn die Kinder vor dem „aufgeputzten Baume mit Wachslichtern, Zuckerwerk und Äpfeln“ stehen. Damals war ein geschmückter Baum noch keineswegs in jeder Familie üblich."],
      ["Kuriosität 2","Das Buch löste ein regelrechtes „Werther-Fieber“ aus. Junge Männer zogen sich an wie die Romanfigur: blauer Frack, gelbe Weste, Stiefel. In Leipzig wurde das Buch 1775 sogar verboten. Der spätere Kaiser Napoleon erzählte Goethe 1808, er habe den Roman sieben Mal gelesen."]
    ]}
  ],
  quelle:[["Freies Deutsches Hochstift / Frankfurter Goethe-Haus: Materialsammlung Werther (PDF)", "https://freies-deutsches-hochstift.de/assets/downloads/materialsammlung-werther.pdf"], ["The Public Domain Review (englisch): The Joys of Young Werther (1775)", "https://publicdomainreview.org/collection/the-joys-of-young-werther-1775/"]] },

{ d:20, motiv:"feder", name:"Schreibfeder", titel:"Gleiches Datum, anderer Tag", format:"Denkrätsel",
  inhalt:[
    {t:"p", x:"Zwei der berühmtesten Schriftsteller der Welt sind William Shakespeare aus England und Miguel de Cervantes aus Spanien, der Autor des „Don Quijote“, in dem ein Ritter gegen Windmühlen kämpft. Beide starben im Jahr 1616, und in den Unterlagen steht bei beiden der 23. April. Deshalb ist der 23. April heute der Welttag des Buches."},
    {t:"aufloesung", q:"Rätsel: Trotzdem starben die beiden nicht am selben Tag. Wie kann das sein?",
     a:["England und Spanien benutzten damals unterschiedliche Kalender. Spanien rechnete schon mit dem neuen, gregorianischen Kalender, England noch mit dem alten, julianischen Kalender, der etwa zehn Tage hinterherhinkte. Shakespeares 23. April war nach unserem heutigen Kalender also ungefähr der 3. Mai.",
        "Außerdem starb Cervantes wohl schon am 22. April, der 23. war sein Begräbnistag. Zwischen den beiden Todestagen lagen also etwa elf Tage."]}
  ],
  quelle:[["Oxford University Press Blog (englisch): Did Shakespeare and Cervantes die on the same day?", "https://blog.oup.com/2012/04/shakespeare-cervantes-die-april-23-1616/"], ["Folger Shakespeare Library (englisch): Shakespeare and Cervantes, 400 years", "https://folger.edu/blogs/shakespeare-and-beyond/shakespeare-and-cervantes-400-years"]] },

{ d:21, motiv:"rolle", name:"Schriftrolle", titel:"Ein Sack voller Bücher", format:"Geschichte aus der Antike",
  inhalt:[
    {t:"p", x:"In der ägyptischen Stadt Alexandria gab es vor über 2000 Jahren die größte Bibliothek der antiken Welt. Die Herrscher wollten dort möglichst jedes Buch der Welt sammeln. Damals bedeutete das: Schriftrollen, die mühsam per Hand abgeschrieben wurden."},
    {t:"p", x:"Ihre Methoden waren ziemlich frech. Laut dem antiken Arzt Galen wurde jedes Schiff, das im Hafen anlegte, nach Büchern durchsucht. Die Bücher wurden beschlagnahmt und abgeschrieben. Die Besitzer bekamen dann die Kopie zurück, das Original behielt die Bibliothek."},
    {t:"p", x:"Noch dreister: Athen lieh Alexandria gegen eine riesige Pfandsumme seine wertvollen offiziellen Abschriften der großen griechischen Theaterstücke. Der König ließ Kopien anfertigen, schickte die Kopien zurück, behielt die Originale und verzichtete einfach auf sein Pfand."}
  ],
  quelle:[["Encyclopaedia Britannica (englisch): Library of Alexandria", "https://www.britannica.com/topic/Library-of-Alexandria"]] },

{ d:22, motiv:"flocke", name:"Schneeflocke", titel:"Das Jahr ohne Sommer", format:"Wettbewerb mit Folgen",
  inhalt:[
    {t:"p", x:"1815 brach in Indonesien der Vulkan Tambora aus. Die Asche in der Luft veränderte das Wetter weltweit. Das Jahr 1816 ging als „Jahr ohne Sommer“ in die Geschichte ein: In Europa war es kalt und verregnet, in manchen Gegenden schneite es sogar im Sommer."},
    {t:"p", x:"Im Juni 1816 saß eine Gruppe junger Leute am Genfer See in einer Villa fest, darunter Lord Byron (der mit dem Bären aus Türchen 12) und die 18-jährige Mary Godwin, später Mary Shelley. Weil es draußen ständig stürmte, schlug Byron einen Wettbewerb vor: Jede und jeder sollte eine Gruselgeschichte schreiben."},
    {t:"p", x:"Das Ergebnis: Mary Shelley erfand „Frankenstein“, die Geschichte eines Wissenschaftlers, der ein künstliches Wesen erschafft. Das Buch erschien 1818 und gilt heute als einer der ersten Science-Fiction-Romane. Ein anderer Gast, John Polidori, schrieb „Der Vampyr“, eine der ersten Vampirgeschichten."}
  ],
  quelle:[["Science Museum London (englisch): The Year Without Summer", "https://blog.sciencemuseum.org.uk/the-year-without-summer/"], ["The Public Domain Review (englisch): Frankenstein and the Climate Refugees of 1816", "https://publicdomainreview.org/essay/frankenstein-the-baroness-and-the-climate-refugees-of-1816"]] },

{ d:23, motiv:"plaetzchen", name:"Plätzchen", titel:"Erinnerung zum Eintunken", format:"Fast-Fehler der Literaturgeschichte",
  inhalt:[
    {t:"p", x:"Der Franzose Marcel Proust schrieb einen der längsten Romane der Welt: „Auf der Suche nach der verlorenen Zeit“. Er erschien zwischen 1913 und 1927 in sieben Bänden und umfasst je nach Ausgabe mehrere Tausend Seiten."},
    {t:"p", x:"Die berühmteste Stelle hat mit Gebäck zu tun: Der Erzähler tunkt ein kleines Gebäck, eine Madeleine, in Lindenblütentee. Beim ersten Bissen kommt plötzlich die Erinnerung an seine ganze Kindheit zurück. Seitdem spricht man von einem „Madeleine-Moment“, wenn ein Geschmack oder Geruch eine alte Erinnerung weckt."},
    {t:"p", x:"Die Kuriosität: In Prousts früheren Entwürfen war es noch gar keine Madeleine, sondern ein Stück geröstetes Brot und später ein Zwieback. Erst danach wurde daraus das elegante Gebäck."}
  ],
  quelle:[["The Guardian (englisch): In search of lost toast", "https://www.theguardian.com/books/2022/oct/10/in-search-of-lost-toast-paris-show-reveals-origins-of-prousts-madeleines"]] },

{ d:24, motiv:"stern", name:"Weihnachtsstern", titel:"Stille Nacht und die erfundenen Mäuse", format:"Mythos-Check zum Heiligabend",
  inhalt:[
    {t:"p", x:"Das bekannteste Weihnachtslied der Welt begann als Gedicht. Der junge Hilfspfarrer Joseph Mohr schrieb den Text von „Stille Nacht, heilige Nacht“ schon 1816 im österreichischen Mariapfarr. Zwei Jahre später, am 24. Dezember 1818, bat er in Oberndorf bei Salzburg den Lehrer Franz Xaver Gruber, eine Melodie dafür zu komponieren. Noch am selben Abend sangen die beiden das Lied zum ersten Mal in der Kirche St. Nikolaus, begleitet von einer Gitarre."},
    {t:"wahl", q:"Mythos-Check: Oft wird erzählt, Mäuse hätten die Orgel angefressen und deshalb habe man schnell ein Lied für Gitarre gebraucht. Stimmt das?", o:["Stimmt","Stimmt nicht"], r:1,
     a:["Dafür gibt es keinerlei Belege. Die Mäusegeschichte ist eine spätere Erfindung. Wahr ist dagegen: Das Lied wurde in mehrere Hundert Sprachen übersetzt und gehört heute zum immateriellen Kulturerbe Österreichs."]},
    {t:"p", x:"Zum Abschluss: Ihr habt jetzt 24 Geschichten über Dichterinnen und Dichter gehört, die faule Äpfel schnüffelten, Bären hielten und Kaffeepulver aßen. Literatur wird eben von Menschen gemacht."},
    {t:"gruss", x:"Frohe Weihnachten wünscht euch Frau Hagn!"}
  ],
  quelle:[["Österreichische UNESCO-Kommission (englisch): „Silent Night“ – the Christmas carol", "https://www.unesco.at/en/culture/intangible-cultural-heritage/national-inventory/news-1/article/silent-night-the-christmas-carol"], ["Stille Nacht Gesellschaft", "https://www.stillenacht.com/de/"]] }
];

/* ---------------- Logik ---------------- */
const JAHR = 2026, MONAT = 11; // Dezember (0-basiert)
const REIHENFOLGE = [7,15,2,21,11,4,18,9,13,1,23,6,16,10,20,3,12,24,8,19,5,14,22,17];
const FORMEN = ["s1","s3","s2","s4"];
const FARBEN = ["b1","b2","b4","b3","b5","b1","b6","b2"];
const SPEICHER = "adventskalender-2026-literatur-geoeffnet";
let vorschauAn = false;
const vorschauGesehen = []; // Haken in der Vorschau, nur bis zum Neuladen
let aktuellerTag = null;

function heute() { return new Date(); }
function istOffen(tag) {
  if (vorschauAn) return true;
  const n = heute(), y = n.getFullYear();
  if (y > JAHR) return true;
  if (y < JAHR || n.getMonth() < MONAT) return false;
  return n.getDate() >= tag;
}
function istHeute(tag) {
  const n = heute();
  return n.getFullYear() === JAHR && n.getMonth() === MONAT && n.getDate() === tag;
}
function tageBis(tag) {
  const n = heute();
  const a = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const b = new Date(JAHR, MONAT, tag);
  return Math.round((b - a) / 86400000);
}
function geoeffnetLesen() {
  try { return JSON.parse(localStorage.getItem(SPEICHER)) || []; } catch (e) { return []; }
}
function geoeffnetMerken(tag) {
  try {
    const l = geoeffnetLesen();
    if (l.indexOf(tag) < 0) { l.push(tag); localStorage.setItem(SPEICHER, JSON.stringify(l)); }
  } catch (e) {}
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const SCHLOSS = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="#EF7C8E" stroke="#3B2A30" stroke-width="2"/><path d="M8 11 V8 a4 4 0 0 1 8 0 V11" fill="none" stroke="#3B2A30" stroke-width="2"/></svg>';
const HAKEN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 L10 17 L19 7" fill="none" stroke="#2F7A57" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function datumText(tag) { return tag + ". Dezember " + JAHR; }

function kalenderBauen() {
  const k = document.getElementById("kalender");
  k.innerHTML = "";
  const offenListe = geoeffnetLesen();
  REIHENFOLGE.forEach(function (tag, i) {
    const t = TUERCHEN[tag - 1];
    const b = el("button", "tuer " + (tag === 24 ? "s3 b4 gross" : FORMEN[(tag * 3) % 4] + " " + FARBEN[(tag + i) % FARBEN.length]));
    b.type = "button";
    b.dataset.tag = tag;
    const offen = istOffen(tag);
    const schonGesehen = offenListe.indexOf(tag) >= 0;
    let label = "Türchen " + tag + ", " + t.name + ". ";
    if (!offen) label += "Öffnet am " + datumText(tag) + ".";
    else if (schonGesehen) label += "Schon geöffnet.";
    else label += "Kann geöffnet werden.";
    if (istHeute(tag)) { label += " Heute!"; b.classList.add("heute"); }
    b.setAttribute("aria-label", label);
    b.innerHTML = svg(t.motiv);
    b.appendChild(el("span", "nummer", String(tag))).setAttribute("aria-hidden", "true");
    const m = el("span", "marke");
    m.setAttribute("aria-hidden", "true");
    if (!offen) { m.innerHTML = SCHLOSS; b.appendChild(m); }
    else if (vorschauAn ? vorschauGesehen.indexOf(tag) >= 0 : schonGesehen) { m.classList.add("erledigt"); m.innerHTML = HAKEN; b.appendChild(m); }
    if (istHeute(tag)) { const s = el("span", "heute-schild", "Heute"); s.setAttribute("aria-hidden", "true"); b.appendChild(s); }
    b.addEventListener("click", function () { oeffnen(tag); });
    k.appendChild(b);
  });
}

function statusSetzen() {
  const n = heute();
  const datum = n.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  let s = "Heute ist " + datum + ". ";
  const vorStart = n.getFullYear() < JAHR || (n.getFullYear() === JAHR && n.getMonth() < MONAT);
  if (vorStart) {
    const t = tageBis(1);
    s += "Am 1. Dezember 2026 öffnet sich das erste Türchen – noch " + t + (t === 1 ? " Tag." : " Tage.");
  } else if (n.getFullYear() === JAHR && n.getMonth() === MONAT && n.getDate() <= 24) {
    s += "Heute öffnet sich Türchen " + n.getDate() + ". Viel Spaß!";
  } else {
    s += "Alle 24 Türchen sind geöffnet. Viel Spaß beim Nachlesen!";
  }
  document.getElementById("status").textContent = s;
}

function blockBauen(b, ziel, idBasis) {
  if (b.t === "p") { ziel.appendChild(el("p", null, b.x)); return; }
  if (b.t === "gruss") { ziel.appendChild(el("p", "gruss", b.x)); return; }
  if (b.t === "fakten") {
    const ul = el("ul", "fakten");
    b.f.forEach(function (f) {
      const li = el("li");
      li.appendChild(el("span", "etikett", f[0] + ": "));
      li.appendChild(document.createTextNode(f[1]));
      ul.appendChild(li);
    });
    ziel.appendChild(ul);
    return;
  }
  if (b.t === "aufloesung") {
    const box = el("div", "block");
    box.appendChild(el("p", "frage", b.q));
    const knopfText = b.knopf || "Auflösung zeigen";
    const btn = el("button", "btn", knopfText);
    btn.type = "button";
    btn.setAttribute("aria-expanded", "false");
    btn.setAttribute("aria-controls", idBasis);
    const antw = el("div", "antwort");
    antw.id = idBasis;
    antw.hidden = true;
    b.a.forEach(function (x) { antw.appendChild(el("p", null, x)); });
    btn.addEventListener("click", function () {
      const zu = antw.hidden;
      antw.hidden = !zu;
      btn.setAttribute("aria-expanded", String(zu));
      btn.textContent = zu ? knopfText.replace("zeigen", "verbergen") : knopfText;
    });
    box.appendChild(btn);
    box.appendChild(antw);
    ziel.appendChild(box);
    return;
  }
  if (b.t === "wahl") {
    const box = el("div", "block");
    const q = el("p", "frage", b.q);
    q.id = idBasis + "-q";
    box.appendChild(q);
    const opt = el("div", "optionen");
    opt.setAttribute("role", "group");
    opt.setAttribute("aria-labelledby", q.id);
    const rm = el("div", "rueckmeldung");
    rm.hidden = true;
    rm.setAttribute("aria-live", "polite");
    const knoepfe = b.o.map(function (text, i) {
      const k = el("button", "btn", text);
      k.type = "button";
      k.setAttribute("aria-pressed", "false");
      k.addEventListener("click", function () {
        knoepfe.forEach(function (x) { x.classList.remove("richtig", "falsch"); x.setAttribute("aria-pressed", "false"); });
        k.setAttribute("aria-pressed", "true");
        knoepfe[b.r].classList.add("richtig");
        const treffer = i === b.r;
        if (!treffer) k.classList.add("falsch");
        rm.innerHTML = "";
        rm.className = "rueckmeldung" + (treffer ? "" : " daneben");
        rm.appendChild(el("strong", null, treffer ? "Richtig!" : "Knapp daneben – macht nichts! Richtig ist: " + b.o[b.r] + "."));
        b.a.forEach(function (x) { rm.appendChild(el("p", null, x)); });
        rm.hidden = false;
      });
      opt.appendChild(k);
      return k;
    });
    box.appendChild(opt);
    box.appendChild(rm);
    ziel.appendChild(box);
  }
}

function fussBauen(tag) {
  const fuss = el("div", "d-fuss");
  const zur = el("button", "btn hell", "‹ Türchen " + (tag - 1));
  zur.type = "button";
  zur.disabled = tag === 1;
  if (tag === 1) zur.style.visibility = "hidden";
  zur.addEventListener("click", function () { oeffnen(tag - 1); });
  const zu = el("button", "btn", "Schließen");
  zu.type = "button";
  zu.addEventListener("click", schliessen);
  const vor = el("button", "btn hell", "Türchen " + (tag + 1) + " ›");
  vor.type = "button";
  vor.disabled = tag === 24;
  if (tag === 24) vor.style.visibility = "hidden";
  vor.addEventListener("click", function () { oeffnen(tag + 1); });
  fuss.appendChild(zur); fuss.appendChild(zu); fuss.appendChild(vor);
  return { fuss: fuss, zu: zu };
}

function oeffnen(tag) {
  aktuellerTag = tag;
  const t = TUERCHEN[tag - 1];
  const dlg = document.getElementById("dialog");
  const inhalt = document.getElementById("dInhalt");
  inhalt.innerHTML = "";
  let fokusZiel;

  if (!istOffen(tag)) {
    const g = el("div", "gesperrt");
    const m = el("div", "motiv-gross");
    m.innerHTML = svg(t.motiv);
    g.appendChild(m);
    const h = el("h2", null, "Noch ein bisschen Geduld!");
    h.id = "dTitel";
    g.appendChild(h);
    g.appendChild(el("p", null, "Türchen " + tag + " öffnet sich am " + datumText(tag) + "."));
    const n = tageBis(tag);
    g.appendChild(el("p", null, n === 1 ? "Nur noch 1 Tag – morgen ist es so weit!" : "Noch " + n + " Tage. Die Geschichte wartet schon auf euch."));
    inhalt.appendChild(g);
    const f = fussBauen(tag);
    inhalt.appendChild(f.fuss);
    fokusZiel = f.zu;
  } else {
    if (!vorschauAn) geoeffnetMerken(tag);
    else if (vorschauGesehen.indexOf(tag) < 0) vorschauGesehen.push(tag);
    const kopf = el("div", "d-kopf");
    const m = el("div", "motiv");
    m.innerHTML = svg(t.motiv);
    kopf.appendChild(m);
    const meta = el("div");
    meta.appendChild(el("p", "d-datum", "Türchen " + tag + " · " + datumText(tag)));
    const h = el("h2", "d-titel", t.titel);
    h.id = "dTitel";
    meta.appendChild(h);
    meta.appendChild(el("span", "chip", t.format));
    kopf.appendChild(meta);
    inhalt.appendChild(kopf);
    const text = el("div", "d-text");
    t.inhalt.forEach(function (b, i) { blockBauen(b, text, "t" + tag + "b" + i); });
    const q = el("div", "quelle");
    q.appendChild(el("strong", null, t.quelle.length > 1 ? "Quellen zum Weiterlesen:" : "Quelle zum Weiterlesen:"));
    const ql = el("ul");
    t.quelle.forEach(function (x) {
      const li = el("li");
      const a = el("a", null, x[0]);
      a.href = x[1];
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      li.appendChild(a);
      ql.appendChild(li);
    });
    q.appendChild(ql);
    text.appendChild(q);
    inhalt.appendChild(text);
    const f = fussBauen(tag);
    inhalt.appendChild(f.fuss);
    fokusZiel = f.zu;
  }

  if (!dlg.open) {
    if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
  }
  dlg.scrollTop = 0;
  if (fokusZiel) fokusZiel.focus();
}

function schliessen() {
  const dlg = document.getElementById("dialog");
  if (typeof dlg.close === "function") dlg.close(); else { dlg.removeAttribute("open"); nachSchliessen(); }
}
function nachSchliessen() {
  kalenderBauen();
  if (aktuellerTag) {
    const b = document.querySelector('.tuer[data-tag="' + aktuellerTag + '"]');
    if (b) b.focus();
  }
}

function vorschauBauen() {
  if (!VORSCHAU) return;
  const bereich = document.getElementById("vorschauBereich");
  const wrap = el("div", "vorschau");
  const label = el("label", "schalter");
  const input = document.createElement("input");
  input.type = "checkbox";
  input.setAttribute("role", "switch");
  input.id = "vorschauSchalter";
  const spur = el("span", "spur");
  spur.setAttribute("aria-hidden", "true");
  label.appendChild(input);
  label.appendChild(spur);
  label.appendChild(el("span", null, "Vorschau: alle Türchen öffnen"));
  wrap.appendChild(label);
  wrap.appendChild(el("small", null, "Nur für Lehrkräfte · Vorschau, keine sichere Zugangssperre"));
  bereich.appendChild(wrap);
  const hinweis = el("p", "vorschau-hinweis", "Vorschau aktiv: Alle Türchen sind zum Prüfen geöffnet. Für die Klasse in der Datei VORSCHAU = false setzen.");
  hinweis.hidden = true;
  document.querySelector(".panel").appendChild(hinweis);
  input.addEventListener("change", function () {
    vorschauAn = input.checked;
    hinweis.hidden = !vorschauAn;
    kalenderBauen();
  });
}

function himmelBauen() {
  const h = document.getElementById("himmel");
  for (let i = 0; i < 70; i++) {
    const s = el("span", "stern");
    const g = Math.random() * 2 + 1;
    s.style.cssText = "width:" + g + "px;height:" + g + "px;left:" + (Math.random() * 100) + "%;top:" + (Math.random() * 75) + "%;animation-delay:" + (Math.random() * 3) + "s";
    h.appendChild(s);
  }
  for (let i = 0; i < 34; i++) {
    const f = el("span", "flocke");
    const g = Math.random() * 5 + 3;
    f.style.cssText = "width:" + g + "px;height:" + g + "px;left:" + (Math.random() * 100) + "%;animation-duration:" + (9 + Math.random() * 12) + "s;animation-delay:-" + (Math.random() * 20) + "s;opacity:" + (0.45 + Math.random() * 0.5);
    h.appendChild(f);
  }
  const deko = document.getElementById("kopfDeko");
  ["#F4B942", "#EF7C8E", "#fff", "#EF7C8E", "#F4B942"].forEach(function (c, i) {
    deko.insertAdjacentHTML("beforeend", '<svg viewBox="0 0 100 100"><path d="' + SP + '" fill="' + c + '" stroke="#3B2A30" stroke-width="5" stroke-linejoin="round" transform="' + (i === 2 ? "" : "translate(50 52) scale(0.8) translate(-50 -52)") + '"/></svg>');
  });
}

document.getElementById("dialog").addEventListener("close", nachSchliessen);
document.getElementById("dialog").addEventListener("click", function (e) {
  if (e.target === e.currentTarget) schliessen();
});

himmelBauen();
vorschauBauen();
statusSetzen();
kalenderBauen();
</script>
</body>
</html>
